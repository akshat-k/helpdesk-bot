services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable image reference}
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 9191
      DB_URL: ${DB_URL:?Set a production MySQL JDBC URL with TLS enabled}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME from a secret manager}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD from a secret manager}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-30}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set the production Kafka bootstrap servers}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:?Set Kafka credentials from a secret manager}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?Set Kafka credentials from a secret manager}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SASL_SSL}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-512}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-6}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY from a secret manager}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET from a secret manager}
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:?Set the allowed company email domain}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set explicit HTTPS frontend origins}
      OPS_ADMIN_SUBJECTS: ${OPS_ADMIN_SUBJECTS:?Set comma-separated Google subject IDs for operators}
      MAIL_HOST: ${MAIL_HOST:?Set the SMTP host}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set SMTP credentials}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set SMTP credentials from a secret manager}
      MAIL_FROM: ${MAIL_FROM:?Set a verified sender address}
      SUPPORT_TEAM_EMAIL: ${SUPPORT_TEAM_EMAIL:?Set a support mailbox}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?Set a protected OTLP collector endpoint}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
    expose:
      - "9191"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9191/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal
  proxy:
    image: nginxinc/nginx-unprivileged:1.27.5-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-9191}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,noexec,nosuid
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  internal:
