groups:
  - name: novadesk
    rules:
      - alert: HelpdeskOutboxDeadEvents
        expr: helpdesk_outbox_events{status="DEAD"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Dead ticket notification events need operator review
      - alert: HelpdeskOutboxBacklog
        expr: helpdesk_outbox_events{status="PENDING"} > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Ticket event outbox backlog is growing
      - alert: HelpdeskOutboxOldPendingEvents
        expr: helpdesk_outbox_oldest_pending_age_seconds > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Ticket notifications are waiting in the outbox for more than ten minutes
