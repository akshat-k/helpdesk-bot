limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=10r/s;

upstream helpdesk_app {
    zone helpdesk_app 64k;
    server app:9191 resolve;
    keepalive 32;
}

server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        proxy_pass http://helpdesk_app/actuator/health/readiness;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location / {
        limit_req zone=api_rate_limit burst=30 nodelay;
        limit_req_status 429;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://helpdesk_app;
    }
}
