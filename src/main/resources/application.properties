spring.application.name=help-desk-bot
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/helpdesk_bot}
spring.datasource.username=${DB_USERNAME:helpdesk}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.port=9191


spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

spring.ai.vertex.ai.gemini.chat.options.temperature=0.3
spring.ai.vertex.ai.gemini.chat.options.max-output-tokens=2048

# Google OAuth2 Client (for login flow)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

# Google JWKS URI (for JWT validation on API calls)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# Your domain ? restrict to company emails only
app.security.allowed-domain=${ALLOWED_DOMAIN:}
spring.main.allow-circular-references=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=helpdesk-email-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.akshat.ai.help_desk_bot.event
spring.kafka.producer.properties.spring.json.add.type.headers=true

# Transactional outbox publisher
app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:1000}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
app.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:8}
app.outbox.lease-seconds=${OUTBOX_LEASE_SECONDS:60}
app.outbox.initial-backoff-ms=${OUTBOX_INITIAL_BACKOFF_MS:1000}
app.outbox.max-backoff-ms=${OUTBOX_MAX_BACKOFF_MS:60000}
app.outbox.send-timeout-ms=${OUTBOX_SEND_TIMEOUT_MS:10000}

# Kafka listener retries before dead-letter topic routing
app.kafka.partitions=${KAFKA_PARTITIONS:3}
app.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:1}
app.kafka.retry.max-attempts=${KAFKA_CONSUMER_RETRIES:3}
app.kafka.retry.backoff-ms=${KAFKA_CONSUMER_RETRY_BACKOFF_MS:1000}

# Topic names
app.kafka.topics.ticket-created=ticket-created
app.kafka.topics.ticket-updated=ticket-updated
app.kafka.topics.ticket-resolved=ticket-resolved

# Mail ? using Gmail SMTP (replace with company SMTP)

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App mail config

# Environment-backed overrides for local and production deployments
spring.datasource.password=${DB_PASSWORD:helpdesk_local}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.support-team=${SUPPORT_TEAM_EMAIL:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.ops.admin-subjects=${OPS_ADMIN_SUBJECTS:}

# Process lifecycle and connection pool
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}

# Outbox retention
app.outbox.retention-days=${OUTBOX_RETENTION_DAYS:90}
app.outbox.cleanup-cron=${OUTBOX_CLEANUP_CRON:0 30 2 * * *}

# Health, metrics, and tracing
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
